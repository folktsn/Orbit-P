name: HO-Recruitment - Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/ubuntu/orbit-p-folktsn
            # Reclaim disposable caches before Git needs space to fetch updates.
            cache_dir="$(pwd -P)/.next/cache"
            if [ -d "$cache_dir" ]; then
              test "$(realpath "$cache_dir")" = "$cache_dir"
              rm -rf -- "$cache_dir"
            fi
            npm cache clean --force
            df -h .
            ./scripts/deploy-production.sh

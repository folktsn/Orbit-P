name: OrbitHire ERP - Automated CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Navigate to the project directory
            cd ~/Project/Orbit-P || cd /var/www/Orbit-P || cd ~/Orbit-P || cd /home/pattaya-aviation/Orbit-P || cd "C:/New folder/Project"
            
            echo "==== STARTING AUTO DEPLOY ===="
            
            # Pull the latest changes from GitHub
            git pull origin main
            
            # Install packages
            npm install --legacy-peer-deps
            
            # Run prisma migrations/checks if applicable
            npx prisma db push --accept-data-loss || true
            
            # Build the production optimized application
            npm run build
            
            # Restart PM2 process to apply updates with zero downtime
            pm2 restart all || pm2 restart orbit-p-app || pm2 start npm --name "orbit-p-app" -- run start || npm run start
            
            echo "==== AUTO DEPLOY COMPLETED SUCCESSFULLY ===="
